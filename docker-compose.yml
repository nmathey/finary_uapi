services:
  finary-mcp:
    build: .
    container_name: finary-mcp
    restart: unless-stopped            
    ports:
      - "8000:8000"                   
    env_file: .env                     
    volumes:
      - ./data:/data                   # jwt.json + cookies.txt persistants
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s